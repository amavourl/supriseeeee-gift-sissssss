<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Gift For You 🎁</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    color: white;
    overflow: hidden;

    background:
        linear-gradient(rgba(20,5,30,.45), rgba(20,5,30,.78)),
        url("file_00000000b908820aace7d8bce9a821b7.png");

    background-size: cover;
    background-position: center;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    text-align: center;
    padding: 25px;
}

h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 17px;
    margin-bottom: 35px;
}

/* GIFT */

.gift {
    width: 150px;
    height: 120px;
    position: relative;
    margin: 0 auto 35px;
    cursor: pointer;
    animation: float 2s infinite ease-in-out;
}

.box {
    position: absolute;
    bottom: 0;
    width: 150px;
    height: 95px;
    background: #6b287d;
    border-radius: 8px;
    border: 2px solid #e5c96b;
}

.lid {
    position: absolute;
    top: 15px;
    left: -8px;
    width: 166px;
    height: 32px;
    background: #823695;
    border: 2px solid #e5c96b;
    border-radius: 7px;
    transition: .8s;
}

.ribbon-vertical {
    position: absolute;
    width: 22px;
    height: 95px;
    background: #e5c96b;
    left: 64px;
    bottom: 0;
}

.ribbon-horizontal {
    position: absolute;
    width: 166px;
    height: 17px;
    background: #e5c96b;
    left: -8px;
    top: 23px;
}

.bow {
    position: absolute;
    top: -12px;
    left: 47px;
    width: 56px;
    height: 30px;
}

.bow:before,
.bow:after {
    content: "";
    position: absolute;
    width: 32px;
    height: 25px;
    border: 5px solid #e5c96b;
    border-radius: 50%;
}

.bow:before {
    left: -2px;
}

.bow:after {
    right: -2px;
}

.gift.open .lid {
    transform: translateY(-70px) rotate(-8deg);
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

.message {
    display: none;
    animation: appear 1.2s ease;
}

.message h2 {
    font-size: 35px;
    color: #f1d477;
}

.message p {
    font-size: 18px;
    line-height: 1.7;
}

.enter {
    display: inline-block;
    margin-top: 15px;
    padding: 15px 28px;
    border-radius: 30px;
    text-decoration: none;
    color: white;
    border: 1px solid #e5c96b;
    background: rgba(100,50,130,.65);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>A Little Surprise For You 🎁</h1>

    <div class="subtitle">
        There's something waiting inside...
    </div>

    <div class="gift" id="gift" onclick="openGift()">

        <div class="bow"></div>

        <div class="lid"></div>

        <div class="box"></div>

        <div class="ribbon-vertical"></div>

        <div class="ribbon-horizontal"></div>

    </div>

    <div id="tap">
        <p>Tap the gift 🎁</p>
    </div>

    <div class="message" id="message">

        <h2>Happy Birthday, Sis! ✨</h2>

        <p>
            Your little surprise has finally opened. 💜
            <br>
            Now there's a whole little world waiting
            for you to discover.
        </p>

        <a class="enter" href="world.html">
            Enter Your Little World ✨
        </a>

    </div>

</div>

<!-- Change this filename to whatever your music file is called -->

<audio id="birthdaySong">
    <source src="happy-birthday.mp3" type="audio/mpeg">
</audio>

<script>

function openGift() {

    const gift = document.getElementById("gift");
    const message = document.getElementById("message");
    const tap = document.getElementById("tap");
    const song = document.getElementById("birthdaySong");

    gift.classList.add("open");

    tap.style.display = "none";

    setTimeout(function() {

        message.style.display = "block";

        song.play().catch(function() {
            console.log("Music needs user interaction.");
        });

    }, 700);
}

</script>

</body>
</html>
