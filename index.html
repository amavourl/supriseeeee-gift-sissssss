<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supriseeee Gift Sis 🎁</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f7e8f3;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  padding: 25px;
}

h1 {
  color: #8b2f72;
}

.gift {
  font-size: 110px;
  border: none;
  background: none;
  cursor: pointer;
  animation: bounce 1.5s infinite;
}

@keyframes bounce {
  50% { transform: translateY(-12px); }
}

#surprise {
  display: none;
}

#surprise img {
  width: 90%;
  max-width: 400px;
  border-radius: 20px;
  margin-top: 20px;
}

.message {
  font-size: 22px;
  font-weight: bold;
  color: #7b245f;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<div id="gift">
  <h1>🎁 Tap your surprise, sis! 🎁</h1>
  <button class="gift" onclick="openGift()">🎁</button>
</div>

<div id="surprise">
  <h1>Surpriseeee! ❤️</h1>

  <img src="file_00000000b908820aace7d8bce9a821b7.png">

  <div class="message">
    I know it's small but please accept it.<br>
    Happy birthday sis ❤️🎂🎉
  </div>
</div>

</div>

<script>
function openGift() {
  document.getElementById("gift").style.display = "none";
  document.getElementById("surprise").style.display = "block";
}
</script>

</body>
</html>
